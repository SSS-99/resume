name: Generate resume PDF

on:
  push:
    branches: [main]
    paths-ignore:
      - assets/resume.pdf
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resume-pdf
  cancel-in-progress: true

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Serve site locally
        run: |
          python3 -m http.server 4000 --directory _site > /dev/null 2>&1 &
          curl --silent --fail --retry 10 --retry-connrefused --retry-delay 1 http://localhost:4000/ > /dev/null

      - name: Print to PDF
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu \
            --no-pdf-header-footer \
            --virtual-time-budget=10000 \
            --print-to-pdf=assets/resume.pdf \
            http://localhost:4000/
          ls -l assets/resume.pdf

      - name: Commit PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/resume.pdf
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update resume PDF"
          git push
