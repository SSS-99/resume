name: Generate resume PDF

on:
  push:
    branches: [main]
    # Only when something that affects the rendered page changes
    paths:
      - _data/**
      - _includes/**
      - _layouts/**
      - _sass/**
      - assets/css/**
      - index.html
      - ja/**
      - _config.yml
      - .github/workflows/resume-pdf.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resume-pdf
  cancel-in-progress: true

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build site
        # Empty baseurl so the site works when served from the root below
        run: bundle exec jekyll build --baseurl ""
        env:
          JEKYLL_ENV: production

      - name: Serve site locally
        run: |
          python3 -m http.server 4000 --directory _site > /dev/null 2>&1 &
          curl --silent --fail --retry 10 --retry-connrefused --retry-delay 1 http://localhost:4000/ > /dev/null

      - name: Print to PDF
        run: |
          print_pdf() {
            google-chrome --headless=new --no-sandbox --disable-gpu \
              --no-pdf-header-footer \
              --virtual-time-budget=10000 \
              --print-to-pdf="$1" "$2"
            ls -l "$1"
          }
          print_pdf assets/resume.pdf http://localhost:4000/
          print_pdf assets/resume-ja.pdf http://localhost:4000/ja/

      - name: Commit PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/resume.pdf assets/resume-ja.pdf
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update resume PDF"
          git push
