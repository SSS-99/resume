{% include i18n.html %}
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  {% assign display_name = side.name | default: base.name %}
  <title>{{ display_name | escape }} — {{ L.title | escape }}</title>
  <meta name="description" content="{{ display_name | escape }} — {{ side.tagline | default: base.tagline | escape }}">

  <link rel="icon" href="{{ site.baseurl }}/favicon.svg" type="image/svg+xml">
  <link rel="alternate" hreflang="en" href="{{ site.url }}{{ site.baseurl }}/">
  <link rel="alternate" hreflang="ja" href="{{ site.url }}{{ site.baseurl }}/ja/">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700{% if lang == 'ja' %}&family=IBM+Plex+Sans+JP:wght@400;500;600;700{% endif %}&display=swap">

  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/main.css">
</head>
